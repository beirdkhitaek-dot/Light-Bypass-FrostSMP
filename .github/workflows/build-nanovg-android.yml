name: Build NanoVG for Android (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get LWJGL source (3.3.3)
        uses: actions/checkout@v4
        with:
          repository: LWJGL/lwjgl3
          ref: 3.3.3
          path: lwjgl3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Diagnostics
        run: |
          cd lwjgl3/modules/lwjgl
          echo "--- where warnings macros are defined:"
          grep -rn "define DISABLE_WARNINGS\|define ENABLE_WARNINGS" core/src/main/c | head
          echo "--- head of common_tools.h:"
          sed -n 1,40p core/src/main/c/common_tools.h
          echo "--- stb headers:"
          find . -name 'stb_truetype.h' -o -name 'stb_image.h' | head
          echo "--- GL headers:"
          find . -path '*opengl*' -name '*.h' | head

      - name: Compile with Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          cd lwjgl3/modules/lwjgl
          STB=$(dirname "$(find . -name stb_truetype.h | head -1)")
          echo "stb include dir: $STB"
          INC="-Icore/src/main/c -Icore/src/main/c/linux -Icore/src/generated/c -Inanovg/src/main/c -Inanovg/src/generated/c -I$STB -I$JAVA_HOME/include -I$JAVA_HOME/include/linux"
          DEFS="-DLWJGL_LINUX -DLWJGL_arm64 -DNDEBUG"
          mkdir -p out obj
          FAIL=0
          for f in $(find nanovg/src -name '*.c') core/src/main/c/common_tools.c; do
            o=obj/$(basename "$f" .c).o
            echo "== $f"
            if ! $CC -c -fPIC -O2 -w $DEFS $INC "$f" -o "$o"; then FAIL=1; fi
          done
          if [ "$FAIL" = "1" ]; then echo "SOME FILES FAILED (see errors above)"; exit 1; fi
          $CC -shared obj/*.o -o out/liblwjgl_nanovg.so -lm -ldl -llog
          readelf -d out/liblwjgl_nanovg.so | grep -E 'NEEDED|SONAME'
          echo "JNI exports: $(nm -D out/liblwjgl_nanovg.so | grep -c Java_org_lwjgl_nanovg)"
          echo "undefined non-libc symbols:"; nm -D --undefined-only out/liblwjgl_nanovg.so | grep -vE ' (U|w) (mem|str|str|fopen|fclose|fread|fseek|ftell|f?printf|s?printf|malloc|calloc|realloc|free|qsort|abs|[a-z]+f?)$' | head -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: liblwjgl_nanovg-android-arm64
          path: lwjgl3/modules/lwjgl/out/liblwjgl_nanovg.so
