name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Unzip project
        run: unzip -q -o LightBP.zip

      - name: Build
        run: cd LightBP && gradle build

      - name: Collect jar
        run: |
          mkdir -p out
          find LightBP/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} out/ \;
          ls -l out

      - name: Move "latest" tag to this commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LightBP (latest build)
          body: |
            Automatic build of the newest LightBP.
            Built from commit ${{ github.sha }}.
            Requires Minecraft 1.21.11, Fabric Loader 0.18+ and Meteor Client for 1.21.11.
          files: out/*.jar
          make_latest: true
