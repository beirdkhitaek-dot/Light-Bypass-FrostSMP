name: Build and Release

# Put ANY mod source zip in the repo (root folder) and push.
# The newest zip in the last commit is built; if the commit has no zip, the only/first zip is used.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Pick the zip
        id: pick
        run: |
          ZIP=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -i '\.zip$' | head -1 || true)
          if [ -z "$ZIP" ]; then ZIP=$(ls -t ./*.zip 2>/dev/null | head -1 | sed 's|^\./||'); fi
          if [ -z "$ZIP" ]; then echo "No .zip found in the repo"; exit 1; fi
          echo "Using $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP" .zip)" >> "$GITHUB_OUTPUT"

      - name: Unzip project
        run: |
          rm -rf _src && mkdir _src
          unzip -q -o "${{ steps.pick.outputs.zip }}" -d _src

      - name: Find the Gradle project
        id: proj
        run: |
          F=$(find _src -maxdepth 4 \( -name build.gradle.kts -o -name build.gradle \) | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$F" ]; then echo "No build.gradle(.kts) found in the zip"; exit 1; fi
          DIR=$(dirname "$F")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: ver
        run: |
          D="${{ steps.proj.outputs.dir }}"
          V=""
          if [ -f "$D/gradle/libs.versions.toml" ]; then
            V=$(grep -E '^mod-version' "$D/gradle/libs.versions.toml" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          fi
          if [ -z "$V" ] && [ -f "$D/gradle.properties" ]; then
            V=$(grep -E '^(mod_version|version)=' "$D/gradle.properties" | head -1 | cut -d= -f2 | tr -d '\r ')
          fi
          if [ -z "$V" ]; then V="build-${{ github.run_number }}"; fi
          echo "Version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cd "${{ steps.proj.outputs.dir }}"
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew build --stacktrace; else gradle build --stacktrace; fi

      - name: Collect jar
        run: |
          mkdir -p out
          find "${{ steps.proj.outputs.dir }}/build/libs" -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} out/ \;
          ls -l out
          test -n "$(ls out/*.jar 2>/dev/null)" || { echo "No jar was produced"; exit 1; }

      - name: Update name (commit message)
        id: upd
        run: |
          MSG=$(git log -1 --format=%s | cut -c1-80)
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"

      - name: Move "latest" tag to this commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.pick.outputs.name }} v${{ steps.ver.outputs.version }} - ${{ steps.upd.outputs.msg }}
          body: |
            Automatic build of ${{ steps.pick.outputs.name }} v${{ steps.ver.outputs.version }}.
            Source zip: ${{ steps.pick.outputs.zip }}
            Built from commit ${{ github.sha }}.
          files: out/*.jar
          make_latest: true
