name: Build Cherry Blossom android jar

# Put these two files in the repo root:
#   CherryBlossom.jar                                  (the full client jar, 0.5.79)
#   cherryblossom-0.5.80-android-source.zip            (the Android source zip)
# Then run: Actions > "Build Cherry Blossom android jar" > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 0.5.79-android.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check inputs
        run: |
          test -f CherryBlossom.jar || { echo "CherryBlossom.jar is missing from the repo root"; exit 1; }
          test -f cherryblossom-0.5.80-android-source.zip || { echo "source zip is missing from the repo root"; exit 1; }

      - name: Unpack the android source
        run: unzip -q cherryblossom-0.5.80-android-source.zip -d work

      - name: Compile the patched classes (Loom, Minecraft 1.21.11)
        working-directory: work/source
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: Overlay the patched classes onto the full client jar
        run: |
          set -e
          rm -rf base built out
          mkdir base built out
          unzip -q CherryBlossom.jar -d base
          unzip -q work/source/build/libs/cherryblossom-source-built-1.0.0+1.21.11.jar -d built
          # Only these classes change. Everything else stays exactly as in the original jar.
          for pattern in \
            'cherryblossom/integration/DeviceIdentity*.class' \
            'cherryblossom/feature/SpotifyApiSource*.class' \
            'cherryblossom/feature/SpotifyNowPlaying*.class' \
            'cherryblossom/feature/SpotifyHudRenderer*.class'
          do
            ls built/$pattern >/dev/null 2>&1 || { echo "Missing compiled class: $pattern"; exit 1; }
            for f in built/$pattern; do
              rel="${f#built/}"
              mkdir -p "base/$(dirname "$rel")"
              cp "$f" "base/$rel"
              echo "patched $rel"
            done
          done
          # Make the version visible in the build.
          sed -i 's/"version": "0.5.79"/"version": "'"$VERSION"'"/' base/fabric.mod.json
          grep '"version"' base/fabric.mod.json
          # Drop any old signature files (the jar is modified).
          rm -f base/META-INF/*.SF base/META-INF/*.RSA base/META-INF/*.DSA

      - name: Fix the Wheel-layout crash (null guard in the GUI)
        run: |
          set -e
          mkdir -p patchtool asm
          curl -fsSL -o asm/asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7/asm-9.7.jar
          curl -fsSL -o asm/asm-tree.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7/asm-tree-9.7.jar
          cat > patchtool/PatchClickGui.java <<'EOF'
          import org.objectweb.asm.*;
          import org.objectweb.asm.tree.*;
          import java.nio.file.*;

          /** Adds "if (this.wheelCategories == null) return;" to ClickGui methods that dereference it. */
          public class PatchClickGui {
              public static void main(String[] args) throws Exception {
                  Path path = Path.of(args[0]);
                  ClassNode cn = new ClassNode();
                  new ClassReader(Files.readAllBytes(path)).accept(cn, 0);
                  String fieldDesc = null;
                  for (FieldNode f : cn.fields) if (f.name.equals("wheelCategories")) fieldDesc = f.desc;
                  if (fieldDesc == null) throw new IllegalStateException("field wheelCategories not found");
                  int patched = 0;
                  for (MethodNode m : cn.methods) {
                      if ((m.access & (Opcodes.ACC_STATIC | Opcodes.ACC_ABSTRACT | Opcodes.ACC_NATIVE)) != 0) continue;
                      boolean target = m.name.equals("drawWheelModules");
                      for (AbstractInsnNode i = m.instructions.getFirst(); i != null && !target; i = i.getNext()) {
                          if (i instanceof FieldInsnNode f && i.getOpcode() == Opcodes.GETFIELD
                                  && f.name.equals("wheelCategories") && f.owner.equals(cn.name)) {
                              AbstractInsnNode n = i.getNext();
                              while (n != null && n.getOpcode() < 0) n = n.getNext();
                              if (n instanceof MethodInsnNode mi && mi.name.equals("stream")) target = true;
                          }
                      }
                      if (!target) continue;
                      if (!m.desc.endsWith(")V")) throw new IllegalStateException("non-void method needs a manual fix: " + m.name + m.desc);
                      AbstractInsnNode n = m.instructions.getFirst();
                      while (n instanceof LabelNode || n instanceof LineNumberNode) n = n.getNext();
                      if (n instanceof FrameNode) throw new IllegalStateException("unexpected frame at start of " + m.name);
                      LabelNode ok = new LabelNode();
                      InsnList guard = new InsnList();
                      guard.add(new VarInsnNode(Opcodes.ALOAD, 0));
                      guard.add(new FieldInsnNode(Opcodes.GETFIELD, cn.name, "wheelCategories", fieldDesc));
                      guard.add(new JumpInsnNode(Opcodes.IFNONNULL, ok));
                      guard.add(new InsnNode(Opcodes.RETURN));
                      guard.add(ok);
                      guard.add(new FrameNode(Opcodes.F_SAME, 0, null, 0, null));
                      m.instructions.insert(guard);
                      patched++;
                      System.out.println("guarded " + m.name + m.desc);
                  }
                  if (patched == 0) throw new IllegalStateException("nothing patched");
                  ClassWriter cw = new ClassWriter(ClassWriter.COMPUTE_MAXS);
                  cn.accept(cw);
                  Files.write(path, cw.toByteArray());
                  System.out.println("patched " + patched + " method(s)");
              }
          }
          EOF
          javac -cp asm/asm.jar:asm/asm-tree.jar -d patchtool patchtool/PatchClickGui.java
          java -cp patchtool:asm/asm.jar:asm/asm-tree.jar PatchClickGui base/dev/cherryblossom/client/ui/ClickGui.class
          # Make sure the patched class still verifies as valid bytecode
          javap -p -c -cp base dev.cherryblossom.client.ui.ClickGui | grep -c wheelCategories

      - name: Pack the jar
        run: |
          set -e
          (cd base && zip -qr -X "../out/cherryblossom-client-${VERSION}.jar" .)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: cherryblossom-client-${{ env.VERSION }}
          path: out/*.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "Cherry Blossom ${{ env.VERSION }} - Android support, Spotify Web API HUD, Wheel GUI crash fix, Last.fm source"
          body: |
            Android (Zalith) support for the Cherry Blossom client.
            - Device key stored in an owner-only file on non-Windows systems (license check unchanged).
            - Spotify HUD on non-Windows via the Spotify Web API. Setup: put your Client ID in
              config/cherryblossom/spotify/spotify-api.json and add redirect URI http://127.0.0.1:8888/callback
            - Fixes the NullPointerException (wheelCategories is null) in the Wheel GUI layout.
          files: out/*.jar
