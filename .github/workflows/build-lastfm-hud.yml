name: Build Last.fm HUD

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.5.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: lastfm-hud
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: Name the jar with the version
        run: |
          mkdir -p out
          cp "lastfm-hud/build/libs/lastfm-hud-${VERSION}+1.21.11.jar" "out/lastfm-hud-${VERSION}.jar"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: lastfm-hud-${{ env.VERSION }}
          path: out/*.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lastfm-hud-v${{ env.VERSION }}
          name: "Last.fm HUD ${{ env.VERSION }} - Glass GUI theme"
          body: |
            Standalone Last.fm now-playing HUD for Fabric 1.21.11 (works on Android/Zalith).
            Setup: /lastfmhud key <api key>, then /lastfmhud user <username>. See lastfm-hud/README.md.
          files: out/*.jar
